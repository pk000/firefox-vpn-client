name: Build Windows Executable

on:
  workflow_dispatch: # 支持在网页端手动点击运行
  push:
    branches: [ "master", "main" ] # 推送代码到主分支时自动触发

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25' # 匹配项目要求的 Go 1.25+ 环境

      - name: Build Windows amd64 binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o fox-proxy.exe ./cmd/proxy-demo

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: fox-proxy-windows-amd64
          path: fox-proxy.exe
